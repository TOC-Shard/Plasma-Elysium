name: Mirror to GitHub

# Own trigger scoped to master only, rather than the "on: push" (any branch)
# used by external-build.yml plus an `if:` check - so this doesn't even spin
# up a runner for pushes to other branches.
on:
  push:
    branches:
      - master

jobs:
  mirror-github:
    runs-on: debian-12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The TOC product values are no longer part of the repository: the root
      # CMakeLists.txt carries the upstream (H-uru/Plasma) defaults and this
      # fork's values come from ProductIdentity.local.cmake (untracked; CI
      # writes it from the secret PRODUCT_IDENTITY). The only thing left to
      # do here is to refuse to publish if TOC values ever show up again.
      - name: Check the product values and drop the CI config
        run: |
          set -e
          f=CMakeLists.txt
          if grep -qiE 'The Open Cave|"TOC"|5B72B265' "$f"; then
            echo "CMakeLists.txt contains TOC product values" >&2
            exit 1
          fi
          grep -q 'ea489821-6c35-4bd0-9dae-bb17c585e680' "$f"
          # The whole .gitea folder (workflows, CI config) stays off GitHub.
          # This job keeps running from the Gitea checkout, so removing it
          # from the pushed commit does not affect it.
          git rm -r -q .gitea
          git -c user.name="mirror" -c user.email="mirror@localhost" \
            commit -q -am "Mirror: no CI config"

      - name: Push mirror to GitHub
        env:
          # Not GITHUB_MIRROR_TOKEN: Gitea rejects secret names starting with
          # GITHUB_ or GITEA_ (reserved prefixes).
          MIRROR_GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
        run: |
          # --force: this is a one-way mirror, TOC-Shard/Plasma-Elysium's master on
          # GitHub is only ever written to by this job - always overwrite it
          # to match Gitea's master exactly rather than fail on an unrelated
          # divergence (e.g. someone pushing to it directly on GitHub).
          git push --force "https://x-access-token:${MIRROR_GITHUB_TOKEN}@github.com/TOC-Shard/Plasma-Elysium.git" HEAD:master
